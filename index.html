<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>[the] masonybook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Официальные SDK Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f0f2f5;
      --glass-surface: rgba(255, 255, 255, 0.88);
      --glass-surface-card: rgba(255, 255, 255, 0.95);
      --glass-specular: linear-gradient(135deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.4) 45%, rgba(59, 89, 152, 0.08) 100%);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-border-blue: rgba(59, 89, 152, 0.22);
      --glass-shadow: 0 16px 36px rgba(24, 60, 120, 0.08), 0 4px 10px rgba(0, 0, 0, 0.02);

      --fb-blue: #3b5998;
      --fb-blue-dark: #2d4373;
      --accent: #1877f2;
      --accent-glow: rgba(24, 119, 242, 0.28);
      --accent-soft: rgba(24, 119, 242, 0.1);
      
      --text: #0f172a;
      --text-muted: #64748b;
      --header-bg: rgba(59, 89, 152, 0.95);
      --blob-1: rgba(24, 119, 242, 0.14);
      --blob-2: rgba(59, 89, 152, 0.1);
      --grid-line: rgba(59, 89, 152, 0.04);
      --input-bg: #f8fafc;
      --like-red: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    .ambient-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .light-orb-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      top: -120px;
      left: 5%;
      background: radial-gradient(circle, var(--blob-1) 0%, transparent 70%);
      filter: blur(90px);
    }

    .light-orb-2 {
      position: absolute;
      width: 650px;
      height: 650px;
      top: 40%;
      right: -100px;
      background: radial-gradient(circle, var(--blob-2) 0%, transparent 70%);
      filter: blur(100px);
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 45px 45px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 10px;
      width: min(95%, 1160px);
      margin: 0 auto;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 30px rgba(45, 67, 115, 0.22);
    }

    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-user-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.18);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--fb-blue);
      color: #ffffff;
    }

    .btn-secondary {
      background: #ffffff;
      border: 1px solid var(--glass-border-blue);
      color: var(--fb-blue);
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 10px;
    }

    .container {
      width: min(95%, 1160px);
      margin: 20px auto 40px;
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 22px;
      position: relative;
      z-index: 10;
      flex: 1;
    }

    .liquid-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }

    .profile-sidebar {
      padding: 24px 18px;
      height: fit-content;
      position: sticky;
      top: 74px;
      text-align: center;
    }

    .avatar-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--fb-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      box-shadow: 0 6px 18px rgba(59, 89, 152, 0.15);
    }

    .profile-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--fb-blue-dark);
    }

    .profile-status {
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 600;
      margin: 4px 0 16px;
      font-style: italic;
    }

    .profile-info-list {
      text-align: left;
      border-top: 1px solid rgba(59, 89, 152, 0.1);
      border-bottom: 1px solid rgba(59, 89, 152, 0.1);
      padding: 12px 0;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.86rem;
    }

    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 800;
    }

    .info-val {
      color: var(--text);
      font-weight: 700;
    }

    .users-box {
      margin-top: 20px;
      text-align: left;
    }

    .users-box-title {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }

    .user-chip.active {
      background: #ffffff;
      border-color: var(--fb-blue);
      color: var(--fb-blue);
      box-shadow: 0 2px 8px rgba(59, 89, 152, 0.12);
      font-weight: 700;
    }

    .wall-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-composer {
      padding: 18px;
    }

    .post-composer textarea {
      width: 100%;
      height: 80px;
      background: var(--input-bg);
      border: 1px solid rgba(59, 89, 152, 0.18);
      border-radius: 14px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.94rem;
      resize: none;
      outline: none;
    }

    .post-composer textarea:focus {
      border-color: var(--fb-blue);
      background: #ffffff;
    }

    .emoji-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 2px 2px;
      scrollbar-width: none;
    }
    .emoji-row::-webkit-scrollbar { display: none; }

    .emoji-btn {
      background: rgba(59, 89, 152, 0.08);
      border: none;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .emoji-btn:active { transform: scale(1.2); }

    .composer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .composer-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .post-card {
      padding: 18px;
      margin-bottom: 12px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .post-author-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--glass-border-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .post-author-name {
      font-weight: 800;
      font-size: 0.96rem;
      color: var(--fb-blue-dark);
    }

    .post-date {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .post-content {
      font-size: 0.94rem;
      line-height: 1.6;
      margin-bottom: 14px;
      white-space: pre-wrap;
    }

    .post-actions {
      display: flex;
      align-items: center;
      border-top: 1px solid rgba(59, 89, 152, 0.08);
      padding-top: 10px;
    }

    .like-btn {
      background: transparent;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .like-btn.liked {
      color: var(--like-red);
      background: rgba(225, 29, 72, 0.08);
    }

    .like-btn:active {
      transform: scale(1.15);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      padding: 14px;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: min(100%, 420px);
      padding: 24px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--fb-blue-dark);
      margin-bottom: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 0.74rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text-muted);
    }

    .modal-input {
      background: var(--input-bg);
      border: 1px solid rgba(59, 89, 152, 0.2);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--fb-blue);
      background: #ffffff;
    }

    .tab-row {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 6px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 8px 0;
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
    }

    .tab-btn.active {
      color: var(--fb-blue);
      background: rgba(59, 89, 152, 0.08);
    }

    @media (max-width: 768px) {
      header { border-radius: 16px; top: 6px; padding: 8px 12px; }
      .container { grid-template-columns: 1fr; margin-top: 14px; margin-bottom: 30px; }
      .profile-sidebar { position: static; }
      .avatar-wrap { width: 76px; height: 76px; font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <div class="ambient-mesh">
    <div class="light-orb-1"></div>
    <div class="light-orb-2"></div>
  </div>
  <div class="grid-lines"></div>

  <header>
    <div class="brand-logo">
      <span>[the]</span>
      <span>masonybook</span>
    </div>

    <div class="header-controls">
      <div class="current-user-tag" id="headerUserTag" style="display:none;">
        <span id="headerAvatar">👤</span>
        <span id="headerName">Вы</span>
      </div>
      <button class="btn btn-logout" id="logoutBtn" style="display:none;" onclick="logout()" title="Сменить аккаунт">
        Выйти 🚪
      </button>
      <button class="btn btn-primary" id="loginTriggerBtn" onclick="openAuthModal()">
        Войти
      </button>
    </div>
  </header>

  <div class="container">
    <aside class="liquid-panel profile-sidebar">
      <div class="avatar-wrap" id="profAvatar">⏳</div>
      <h2 class="profile-name" id="profName">Загрузка...</h2>
      <div class="profile-status" id="profStatus">Подключение...</div>

      <div class="profile-info-list">
        <div class="info-item">
          <span class="info-label">📍 Город</span>
          <span class="info-val" id="profCity">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">🎓 Образование</span>
          <span class="info-val" id="profEdu">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">🎾 Хобби</span>
          <span class="info-val" id="profHobby">-</span>
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" style="flex:1;" id="editProfileBtn" onclick="openEditModal()">Редактировать</button>
      </div>

      <div class="users-box">
        <div class="users-box-title">
          <span>Участники:</span>
          <span id="usersCount" style="color:var(--fb-blue); font-weight:900;">0</span>
        </div>
        <div id="usersList"></div>
      </div>
    </aside>

    <main class="wall-column">
      <div class="liquid-panel post-composer">
        <textarea id="postText" placeholder="Что нового? Напишите на стене..."></textarea>
        
        <div class="emoji-row">
          <button class="emoji-btn" onclick="insertEmoji('😀')">😀</button>
          <button class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
          <button class="emoji-btn" onclick="insertEmoji('❤️')">❤️</button>
          <button class="emoji-btn" onclick="insertEmoji('🚀')">🚀</button>
          <button class="emoji-btn" onclick="insertEmoji('⚡')">⚡</button>
          <button class="emoji-btn" onclick="insertEmoji('🎾')">🎾</button>
          <button class="emoji-btn" onclick="insertEmoji('💻')">💻</button>
          <button class="emoji-btn" onclick="insertEmoji('😎')">😎</button>
          <button class="emoji-btn" onclick="insertEmoji('👍')">👍</button>
          <button class="emoji-btn" onclick="insertEmoji('🎉')">🎉</button>
        </div>

        <div class="composer-bottom">
          <div class="composer-hint" id="composerHint">Публикация...</div>
          <button class="btn btn-primary" onclick="publishPost()">Опубликовать</button>
        </div>
      </div>

      <div id="feed"></div>
    </main>
  </div>

  <!-- Модальное окно Входа и Регистрации -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <div class="tab-row">
        <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Войти</button>
        <button class="tab-btn" id="tabRegBtn" onclick="switchAuthTab('reg')">+ Создать аккаунт</button>
      </div>

      <!-- Вход -->
      <div id="loginForm">
        <div class="form-group">
          <label>Выберите профиль</label>
          <select id="loginSelectUser" class="modal-input"></select>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPassword" class="modal-input" placeholder="Введите пароль">
        </div>
        <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="handleLogin()">Войти</button>
      </div>

      <!-- Регистрация -->
      <div id="regForm" style="display:none;">
        <div class="form-group">
          <label>Имя *</label>
          <input type="text" id="regName" class="modal-input" placeholder="Как вас зовут?" required>
        </div>
        <div class="form-group">
          <label>Пароль (любой)</label>
          <input type="password" id="regPassword" class="modal-input" placeholder="Придумайте пароль">
        </div>
        <div class="form-group">
          <label>Аватар (эмодзи)</label>
          <input type="text" id="regAvatar" class="modal-input" value="⚡" maxlength="2">
        </div>
        <div class="form-group">
          <label>Город</label>
          <input type="text" id="regCity" class="modal-input" placeholder="Липецк">
        </div>
        <div class="form-group">
          <label>Статус</label>
          <input type="text" id="regStatus" class="modal-input" placeholder="Статус на стене">
        </div>
        <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="handleRegister()">Создать и войти</button>
      </div>
    </div>
  </div>

  <!-- Модалка редактирования профиля -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3 class="modal-title">Редактировать мой профиль</h3>
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="editName" class="modal-input">
      </div>
      <div class="form-group">
        <label>Аватар (эмодзи)</label>
        <input type="text" id="editAvatar" class="modal-input" maxlength="2">
      </div>
      <div class="form-group">
        <label>Новый пароль (оставьте пустым, если не меняете)</label>
        <input type="password" id="editPassword" class="modal-input">
      </div>
      <div class="form-group">
        <label>Статус</label>
        <input type="text" id="editStatus" class="modal-input">
      </div>
      <div class="form-group">
        <label>Город</label>
        <input type="text" id="editCity" class="modal-input">
      </div>
      <div class="form-group">
        <label>Образование</label>
        <input type="text" id="editEdu" class="modal-input">
      </div>
      <div class="form-group">
        <label>Хобби</label>
        <input type="text" id="editHobby" class="modal-input">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
        <button class="btn btn-secondary" onclick="closeModal('editModal')">Отмена</button>
        <button class="btn btn-primary" onclick="saveProfileEdit()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCxL0xZjVHTPZAAFV5pMw9vSBjmDwKAX1Q",
      authDomain: "the-masonybook.firebaseapp.com",
      databaseURL: "https://the-masonybook-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "the-masonybook",
      storageBucket: "the-masonybook.firebasestorage.app",
      messagingSenderId: "859966333747",
      appId: "1:859966333747:web:1caae21f7c83f802599446",
      measurementId: "G-M1TKX10Q7M"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let users = {};
    let currentUserId = localStorage.getItem('mb_auth_uid') || '';
    let viewingUserId = '';

    // Слушатель списка пользователей
    db.ref('users').on('value', (snapshot) => {
      users = snapshot.val() || {};

      if (Object.keys(users).length === 0) {
        const initUser = {
          id: 'u_stepan',
          name: 'Степан',
          password: '',
          avatar: '💻',
          status: '«Основатель [the] masonybook»',
          city: 'Липецк',
          edu: 'Школа',
          hobby: 'Спорт, 3D-моделирование, разработка'
        };
        db.ref('users/' + initUser.id).set(initUser);
        return;
      }

      updateAuthModalUsers();

      if (currentUserId && !users[currentUserId]) {
        logout();
        return;
      }

      if (!viewingUserId || !users[viewingUserId]) {
        viewingUserId = currentUserId || Object.keys(users)[0];
      }

      renderUI();

      if (!currentUserId) {
        openModal('authModal');
      }
    });

    // Слушатель постов с лайками в реальном времени
    db.ref('posts').on('value', () => {
      renderFeed();
    });

    function renderUI() {
      const isAuth = !!currentUserId && !!users[currentUserId];
      document.getElementById('headerUserTag').style.display = isAuth ? 'flex' : 'none';
      document.getElementById('logoutBtn').style.display = isAuth ? 'inline-flex' : 'none';
      document.getElementById('loginTriggerBtn').style.display = isAuth ? 'none' : 'inline-flex';

      if (isAuth) {
        const me = users[currentUserId];
        document.getElementById('headerAvatar').textContent = me.avatar || '👤';
        document.getElementById('headerName').textContent = me.name;
        document.getElementById('composerHint').textContent = `Публикация от: ${me.name}`;
      } else {
        document.getElementById('composerHint').textContent = `Войдите, чтобы писать посты`;
      }

      const viewing = users[viewingUserId];
      if (viewing) {
        document.getElementById('profAvatar').textContent = viewing.avatar || '👤';
        document.getElementById('profName').textContent = viewing.name;
        document.getElementById('profStatus').textContent = viewing.status || 'Статус не указан';
        document.getElementById('profCity').textContent = viewing.city || 'Не указан';
        document.getElementById('profEdu').textContent = viewing.edu || 'Не указано';
        document.getElementById('profHobby').textContent = viewing.hobby || 'Не указано';
      }

      const editBtn = document.getElementById('editProfileBtn');
      editBtn.style.display = (isAuth && currentUserId === viewingUserId) ? 'block' : 'none';

      document.getElementById('usersCount').textContent = Object.keys(users).length;
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = Object.values(users).map(u => `
        <div class="user-chip ${u.id === viewingUserId ? 'active' : ''}" onclick="viewUser('${u.id}')">
          <span style="font-size:1.2rem;">${u.avatar || '👤'}</span>
          <span>${escapeHtml(u.name)}</span>
        </div>
      `).join('');

      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      db.ref('posts').once('value', (snapshot) => {
        const allPosts = snapshot.val() || {};
        const postsArray = Object.values(allPosts).filter(p => p.wallUserId === viewingUserId);

        if (postsArray.length === 0) {
          feed.innerHTML = `
            <div class="liquid-panel post-card" style="text-align:center; color:var(--text-muted); padding:30px;">
              На этой стене пока нет постов. Оставьте первое сообщение!
            </div>
          `;
          return;
        }

        postsArray.sort((a, b) => b.id - a.id);

        feed.innerHTML = postsArray.map(p => {
          const likes = p.likes || {};
          const likeCount = Object.keys(likes).length;
          const isLiked = currentUserId && !!likes[currentUserId];

          return `
            <div class="liquid-panel post-card">
              <div class="post-header">
                <div class="post-author-wrap">
                  <div class="post-author-avatar">${p.authorAvatar || '👤'}</div>
                  <div>
                    <div class="post-author-name">${escapeHtml(p.authorName)}</div>
                    <div class="post-date">${p.date}</div>
                  </div>
                </div>
              </div>
              <div class="post-content">${escapeHtml(p.text)}</div>
              <div class="post-actions">
                <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}')">
                  <span>${isLiked ? '❤️' : '🤍'}</span>
                  <span>${likeCount}</span>
                </button>
              </div>
            </div>
          `;
        }).join('');
      });
    }

    // Лайкинг в реальном времени
    function toggleLike(postId) {
      if (!currentUserId) {
        openAuthModal();
        return;
      }
      const likeRef = db.ref(`posts/${postId}/likes/${currentUserId}`);
      likeRef.once('value', (snap) => {
        if (snap.exists()) {
          likeRef.remove();
        } else {
          likeRef.set(true);
        }
      });
    }

    function insertEmoji(emoji) {
      const textarea = document.getElementById('postText');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      textarea.value = text.substring(0, start) + emoji + text.substring(end);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = start + emoji.length;
    }

    function publishPost() {
      if (!currentUserId) {
        openAuthModal();
        return;
      }

      const textarea = document.getElementById('postText');
      const text = textarea.value.trim();
      if (!text) return;

      const me = users[currentUserId];
      const newPostId = Date.now();
      const newPost = {
        id: newPostId,
        wallUserId: viewingUserId,
        authorId: currentUserId,
        authorName: me.name,
        authorAvatar: me.avatar || '👤',
        text: text,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        likes: {}
      };

      db.ref('posts/' + newPostId).set(newPost);
      textarea.value = '';
    }

    // Авторизация и регистрация
    function updateAuthModalUsers() {
      const select = document.getElementById('loginSelectUser');
      select.innerHTML = Object.values(users).map(u => 
        `<option value="${u.id}">${u.avatar || '👤'} ${escapeHtml(u.name)}</option>`
      ).join('');
    }

    function handleLogin() {
      const uid = document.getElementById('loginSelectUser').value;
      const pass = document.getElementById('loginPassword').value;
      const targetUser = users[uid];

      if (!targetUser) return;
      if ((targetUser.password || '') !== pass) {
        alert('Неверный пароль!');
        return;
      }

      currentUserId = uid;
      viewingUserId = uid;
      localStorage.setItem('mb_auth_uid', uid);
      document.getElementById('loginPassword').value = '';
      closeModal('authModal');
      renderUI();
    }

    function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const pass = document.getElementById('regPassword').value;
      if (!name) return alert('Введите имя!');

      const newId = 'u_' + Date.now();
      const newUser = {
        id: newId,
        name: name,
        password: pass,
        avatar: document.getElementById('regAvatar').value.trim() || '⚡',
        status: document.getElementById('regStatus').value.trim() || 'Новый участник',
        city: document.getElementById('regCity').value.trim() || 'Липецк',
        edu: '',
        hobby: ''
      };

      db.ref('users/' + newId).set(newUser).then(() => {
        currentUserId = newId;
        viewingUserId = newId;
        localStorage.setItem('mb_auth_uid', newId);
        document.getElementById('regName').value = '';
        document.getElementById('regPassword').value = '';
        closeModal('authModal');
      });
    }

    function logout() {
      currentUserId = '';
      localStorage.removeItem('mb_auth_uid');
      renderUI();
      openAuthModal();
    }

    function viewUser(id) {
      viewingUserId = id;
      renderUI();
    }

    function openAuthModal() {
      switchAuthTab('login');
      openModal('authModal');
    }

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('tabLoginBtn').classList.add('active');
        document.getElementById('tabRegBtn').classList.remove('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('regForm').style.display = 'none';
      } else {
        document.getElementById('tabLoginBtn').classList.remove('active');
        document.getElementById('tabRegBtn').classList.add('active');
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('regForm').style.display = 'block';
      }
    }

    function openEditModal() {
      const u = users[currentUserId];
      if (!u) return;
      document.getElementById('editName').value = u.name;
      document.getElementById('editAvatar').value = u.avatar || '👤';
      document.getElementById('editPassword').value = '';
      document.getElementById('editStatus').value = u.status || '';
      document.getElementById('editCity').value = u.city || '';
      document.getElementById('editEdu').value = u.edu || '';
      document.getElementById('editHobby').value = u.hobby || '';
      openModal('editModal');
    }

    function saveProfileEdit() {
      const u = users[currentUserId];
      if (!u) return;

      const newPass = document.getElementById('editPassword').value;
      const updated = {
        ...u,
        name: document.getElementById('editName').value.trim() || u.name,
        avatar: document.getElementById('editAvatar').value.trim() || '👤',
        password: newPass !== '' ? newPass : (u.password || ''),
        status: document.getElementById('editStatus').value.trim(),
        city: document.getElementById('editCity').value.trim(),
        edu: document.getElementById('editEdu').value.trim(),
        hobby: document.getElementById('editHobby').value.trim()
      };

      db.ref('users/' + u.id).set(updated).then(() => {
        closeModal('editModal');
      });
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function escapeHtml(s) { return String(s).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)); }
  </script>
</body>
</html>
