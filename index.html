<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>[the] masonybook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ПАЛИТРА THE [MASONYBOOK]: ЧИСТЫЙ СИНИЙ + БЕЛЫЙ LIQUID GLASS */
    :root {
      --bg: #f0f2f5;
      --glass-surface: rgba(255, 255, 255, 0.85);
      --glass-surface-card: rgba(255, 255, 255, 0.95);
      --glass-specular: linear-gradient(135deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.4) 45%, rgba(59, 89, 152, 0.08) 100%);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-border-blue: rgba(59, 89, 152, 0.22);
      --glass-shadow: 0 20px 45px rgba(24, 60, 120, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03), inset 0 1px 2px rgba(255, 255, 255, 1);

      --fb-blue: #3b5998;
      --fb-blue-dark: #2d4373;
      --accent: #1877f2;
      --accent-glow: rgba(24, 119, 242, 0.28);
      --accent-soft: rgba(24, 119, 242, 0.1);
      
      --text: #0f172a;
      --text-muted: #64748b;
      --header-bg: rgba(59, 89, 152, 0.94);
      --blob-1: rgba(24, 119, 242, 0.16);
      --blob-2: rgba(59, 89, 152, 0.12);
      --grid-line: rgba(59, 89, 152, 0.04);
      --input-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Фоновые сине-голубые сферы */
    .ambient-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .light-orb-1 {
      position: absolute;
      width: 750px;
      height: 750px;
      top: -180px;
      left: 10%;
      background: radial-gradient(circle, var(--blob-1) 0%, transparent 70%);
      filter: blur(100px);
      animation: floatOrb 12s infinite alternate ease-in-out;
    }

    .light-orb-2 {
      position: absolute;
      width: 850px;
      height: 850px;
      top: 35%;
      right: -150px;
      background: radial-gradient(circle, var(--blob-2) 0%, transparent 70%);
      filter: blur(120px);
      animation: floatOrb 16s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.06); }
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 55px 55px;
      pointer-events: none;
      z-index: 0;
    }

    /* Синяя шапка */
    header {
      position: sticky;
      top: 14px;
      left: 50%;
      width: min(95%, 1160px);
      margin: 0 auto;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 16px 36px rgba(45, 67, 115, 0.25), inset 0 1px 1.5px rgba(255, 255, 255, 0.5);
    }

    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 5px;
      text-transform: lowercase;
    }

    .brand-logo .bracket {
      color: rgba(255, 255, 255, 0.7);
      font-weight: 700;
    }

    .brand-logo span.the {
      color: #ffffff;
      font-weight: 800;
    }

    .brand-logo span.name {
      color: #ffffff;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #ffffff;
    }

    .user-select {
      background: transparent;
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      outline: none;
    }

    .user-select option {
      background: #ffffff;
      color: var(--text);
    }

    /* Контейнер макета */
    .container {
      width: min(95%, 1160px);
      margin: 30px auto 60px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      position: relative;
      z-index: 10;
      flex: 1;
    }

    /* Белое стекло Liquid Glass */
    .liquid-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }

    .liquid-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: var(--glass-specular);
      pointer-events: none;
      opacity: 0.7;
    }

    /* Левая колонка: Профиль */
    .profile-sidebar {
      padding: 30px 24px;
      height: fit-content;
      position: sticky;
      top: 86px;
      text-align: center;
    }

    .avatar-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--fb-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      box-shadow: 0 8px 24px rgba(59, 89, 152, 0.18);
    }

    .profile-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--fb-blue-dark);
      margin-bottom: 4px;
    }

    .profile-status {
      font-size: 0.92rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 20px;
      font-style: italic;
    }

    .profile-info-list {
      text-align: left;
      border-top: 1px solid rgba(59, 89, 152, 0.1);
      border-bottom: 1px solid rgba(59, 89, 152, 0.1);
      padding: 16px 0;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.88rem;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .info-val {
      color: var(--text);
      font-weight: 700;
      margin-top: 1px;
    }

    .profile-btn-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 9px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--fb-blue);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(59, 89, 152, 0.3);
    }

    .btn-primary:hover {
      background: var(--fb-blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 89, 152, 0.4);
    }

    .btn-secondary {
      background: #ffffff;
      border: 1px solid var(--glass-border-blue);
      color: var(--fb-blue);
    }

    .btn-secondary:hover {
      background: var(--accent-soft);
      border-color: var(--fb-blue);
    }

    /* Список участников */
    .users-box {
      margin-top: 24px;
      text-align: left;
    }

    .users-box-title {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      border: 1px solid transparent;
      color: var(--text);
    }

    .user-chip:hover {
      background: rgba(59, 89, 152, 0.06);
    }

    .user-chip.active {
      background: #ffffff;
      border-color: var(--fb-blue);
      color: var(--fb-blue);
      box-shadow: 0 2px 8px rgba(59, 89, 152, 0.12);
      font-weight: 700;
    }

    /* Правая колонка: Стена */
    .wall-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .post-composer {
      padding: 22px;
    }

    .post-composer textarea {
      width: 100%;
      height: 85px;
      background: var(--input-bg);
      border: 1px solid rgba(59, 89, 152, 0.18);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.96rem;
      resize: none;
      outline: none;
    }

    .post-composer textarea:focus {
      border-color: var(--fb-blue);
      box-shadow: 0 0 14px var(--accent-glow);
      background: #ffffff;
    }

    .composer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .composer-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Посты */
    .post-card {
      padding: 24px;
      animation: postAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes postAppear {
      from { opacity: 0; transform: translateY(18px) scale(0.98); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .post-author-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post-author-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--glass-border-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .post-author-name {
      font-weight: 800;
      font-size: 1rem;
      color: var(--fb-blue-dark);
    }

    .post-date {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .post-content {
      font-size: 0.98rem;
      line-height: 1.7;
      margin-bottom: 16px;
      white-space: pre-wrap;
      color: var(--text);
    }

    .post-footer {
      border-top: 1px solid rgba(59, 89, 152, 0.08);
      padding-top: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .like-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
    }

    .like-btn:hover {
      background: var(--accent-soft);
      color: var(--fb-blue);
    }

    .like-btn.liked {
      color: #ffffff;
      background: var(--fb-blue);
      box-shadow: 0 2px 10px rgba(59, 89, 152, 0.3);
    }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      padding: 16px;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: min(96%, 480px);
      padding: 30px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
      transform: translateY(20px) scale(0.96);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0) scale(1);
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--fb-blue-dark);
      margin-bottom: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .modal-input {
      background: var(--input-bg);
      border: 1px solid rgba(59, 89, 152, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--fb-blue);
      box-shadow: 0 0 12px var(--accent-glow);
      background: #ffffff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    @media (max-width: 820px) {
      .container {
        grid-template-columns: 1fr;
        margin-top: 18px;
      }
      .profile-sidebar {
        position: static;
      }
      header {
        border-radius: 20px;
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-mesh">
    <div class="light-orb-1"></div>
    <div class="light-orb-2"></div>
  </div>
  <div class="grid-lines"></div>

  <!-- Верхняя панель The [masonybook] -->
  <header>
    <div class="brand-logo">
      <span class="bracket">[</span><span class="the">the</span><span class="bracket">]</span>
      <span class="name">masonybook</span>
    </div>

    <div class="header-controls">
      <div class="user-badge">
        <span>Вы:</span>
        <select class="user-select" id="activeUserSelect" onchange="switchCurrentUser(this.value)">
          <!-- Заполняется JS -->
        </select>
      </div>

      <button class="btn btn-primary" style="padding: 6px 14px; font-size: 0.8rem; background: #ffffff; color: var(--fb-blue); box-shadow: none;" onclick="openCreateModal()">
        + Профиль
      </button>
    </div>
  </header>

  <!-- Главный контейнер -->
  <div class="container">

    <!-- Левая колонка: Профиль -->
    <aside class="liquid-panel profile-sidebar">
      <div class="avatar-wrap" id="profAvatar">💻</div>
      <h2 class="profile-name" id="profName">Степан</h2>
      <div class="profile-status" id="profStatus">«Строю [the] masonybook на GitHub Pages»</div>

      <div class="profile-info-list">
        <div class="info-item">
          <span class="info-label">📍 Город</span>
          <span class="info-val" id="profCity">Липецк</span>
        </div>
        <div class="info-item">
          <span class="info-label">🎓 Образование</span>
          <span class="info-val" id="profEdu">Лицей №44</span>
        </div>
        <div class="info-item">
          <span class="info-label">🎾 Хобби</span>
          <span class="info-val" id="profHobby">Теннис, 3D-моделирование</span>
        </div>
      </div>

      <div class="profile-btn-row">
        <button class="btn btn-secondary" onclick="openEditModal()">Редактировать</button>
      </div>

      <div class="users-box">
        <div class="users-box-title">
          <span>Участники:</span>
          <span id="usersCount" style="color: var(--fb-blue); font-weight: 900;">1</span>
        </div>
        <div id="usersList">
          <!-- Список пользователей -->
        </div>
      </div>
    </aside>

    <!-- Правая колонка: Стена -->
    <main class="wall-column">
      <div class="liquid-panel post-composer">
        <textarea id="postText" placeholder="Что у вас нового? Напишите на стене..."></textarea>
        <div class="composer-bottom">
          <div class="composer-hint" id="composerHint">Публикация от имени: Степан</div>
          <button class="btn btn-primary" onclick="publishPost()">Опубликовать</button>
        </div>
      </div>

      <div id="feed">
        <!-- Посты стены -->
      </div>
    </main>

  </div>

  <!-- МОДАЛЬНОЕ ОКНО: РЕДАКТИРОВАНИЕ -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3 class="modal-title">Редактировать профиль</h3>
      
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" id="editName" class="modal-input" required>
      </div>
      <div class="form-group">
        <label>Аватар (эмодзи)</label>
        <input type="text" id="editAvatar" class="modal-input" maxlength="2">
      </div>
      <div class="form-group">
        <label>Статус</label>
        <input type="text" id="editStatus" class="modal-input">
      </div>
      <div class="form-group">
        <label>Город</label>
        <input type="text" id="editCity" class="modal-input">
      </div>
      <div class="form-group">
        <label>Образование</label>
        <input type="text" id="editEdu" class="modal-input">
      </div>
      <div class="form-group">
        <label>Хобби и интересы</label>
        <input type="text" id="editHobby" class="modal-input">
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('editModal')">Отмена</button>
        <button class="btn btn-primary" onclick="saveProfileEdit()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: СОЗДАНИЕ ПРОФИЛЯ -->
  <div class="modal-overlay" id="createModal">
    <div class="modal-box">
      <h3 class="modal-title">+ Новый профиль</h3>
      
      <div class="form-group">
        <label>Имя *</label>
        <input type="text" id="createName" class="modal-input" placeholder="Например: Денис" required>
      </div>
      <div class="form-group">
        <label>Аватар (эмодзи)</label>
        <input type="text" id="createAvatar" class="modal-input" value="⚡" maxlength="2">
      </div>
      <div class="form-group">
        <label>Статус</label>
        <input type="text" id="createStatus" class="modal-input" placeholder="Добро пожаловать в [the] masonybook!">
      </div>
      <div class="form-group">
        <label>Город</label>
        <input type="text" id="createCity" class="modal-input" placeholder="Липецк">
      </div>
      <div class="form-group">
        <label>Образование</label>
        <input type="text" id="createEdu" class="modal-input" placeholder="Лицей / ВУЗ">
      </div>
      <div class="form-group">
        <label>Хобби</label>
        <input type="text" id="createHobby" class="modal-input" placeholder="Спорт, IT, музыка">
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('createModal')">Отмена</button>
        <button class="btn btn-primary" onclick="createNewUser()">Создать профиль</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_USERS = [
      {
        id: 'u_stepan',
        name: 'Степан',
        avatar: '💻',
        status: '«Строю [the] masonybook на GitHub Pages»',
        city: 'Липецк',
        edu: 'Лицей №44',
        hobby: 'Теннис, 3D-моделирование, разработка'
      }
    ];

    const DEFAULT_POSTS = [
      {
        id: 1,
        wallUserId: 'u_stepan',
        authorId: 'u_stepan',
        authorName: 'Степан',
        authorAvatar: '💻',
        text: 'Добро пожаловать в [the] masonybook! Добавляйте профили друзей и делитесь мыслями на стене.',
        date: 'Только что',
        likes: 1,
        liked: true
      }
    ];

    function loadUsers() {
      const data = localStorage.getItem('tmb_users_bw');
      return data ? JSON.parse(data) : DEFAULT_USERS;
    }

    function saveUsers(users) {
      localStorage.setItem('tmb_users_bw', JSON.stringify(users));
    }

    function loadPosts() {
      const data = localStorage.getItem('tmb_posts_bw');
      return data ? JSON.parse(data) : DEFAULT_POSTS;
    }

    function savePosts(posts) {
      localStorage.setItem('tmb_posts_bw', JSON.stringify(posts));
    }

    let users = loadUsers();
    let currentUserId = localStorage.getItem('tmb_curr_bw') || users[0].id;
    let viewingUserId = users[0].id;

    function renderApp() {
      const select = document.getElementById('activeUserSelect');
      select.innerHTML = users.map(u => 
        `<option value="${u.id}" ${u.id === currentUserId ? 'selected' : ''}>${u.avatar} ${u.name}</option>`
      ).join('');

      const me = users.find(u => u.id === currentUserId) || users[0];
      document.getElementById('composerHint').textContent = `Публикация от имени: ${me.name}`;

      const viewingUser = users.find(u => u.id === viewingUserId) || users[0];
      document.getElementById('profAvatar').textContent = viewingUser.avatar || '👤';
      document.getElementById('profName').textContent = viewingUser.name;
      document.getElementById('profStatus').textContent = viewingUser.status || 'Статус не указан';
      document.getElementById('profCity').textContent = viewingUser.city || 'Не указан';
      document.getElementById('profEdu').textContent = viewingUser.edu || 'Не указано';
      document.getElementById('profHobby').textContent = viewingUser.hobby || 'Не указано';

      document.getElementById('usersCount').textContent = users.length;
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = users.map(u => `
        <div class="user-chip ${u.id === viewingUserId ? 'active' : ''}" onclick="viewUser('${u.id}')">
          <span style="font-size: 1.2rem;">${u.avatar || '👤'}</span>
          <span>${u.name}</span>
        </div>
      `).join('');

      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      const posts = loadPosts().filter(p => p.wallUserId === viewingUserId);

      if (posts.length === 0) {
        feed.innerHTML = `
          <div class="liquid-panel post-card" style="text-align: center; color: var(--text-muted);">
            На этой стене пока нет записей. Напишите первое сообщение!
          </div>
        `;
        return;
      }

      feed.innerHTML = posts.map(p => `
        <div class="liquid-panel post-card">
          <div class="post-header">
            <div class="post-author-wrap">
              <div class="post-author-avatar">${p.authorAvatar}</div>
              <div>
                <div class="post-author-name">${escapeHtml(p.authorName)}</div>
                <div class="post-date">${p.date}</div>
              </div>
            </div>
          </div>
          <div class="post-content">${escapeHtml(p.text)}</div>
          <div class="post-footer">
            <button class="like-btn ${p.liked ? 'liked' : ''}" onclick="toggleLike(${p.id})">
              👍 Нравится (${p.likes})
            </button>
          </div>
        </div>
      `).join('');
    }

    function switchCurrentUser(id) {
      currentUserId = id;
      localStorage.setItem('tmb_curr_bw', id);
      renderApp();
    }

    function viewUser(id) {
      viewingUserId = id;
      renderApp();
    }

    function publishPost() {
      const textarea = document.getElementById('postText');
      const text = textarea.value.trim();
      if (!text) return;

      const author = users.find(u => u.id === currentUserId) || users[0];
      const posts = loadPosts();

      const newPost = {
        id: Date.now(),
        wallUserId: viewingUserId,
        authorId: author.id,
        authorName: author.name,
        authorAvatar: author.avatar,
        text: text,
        date: 'Только что',
        likes: 0,
        liked: false
      };

      posts.unshift(newPost);
      savePosts(posts);
      textarea.value = '';
      renderFeed();
    }

    function toggleLike(postId) {
      const posts = loadPosts();
      const p = posts.find(item => item.id === postId);
      if (p) {
        if (p.liked) {
          p.likes--;
          p.liked = false;
        } else {
          p.likes++;
          p.liked = true;
        }
        savePosts(posts);
        renderFeed();
      }
    }

    function openEditModal() {
      const u = users.find(item => item.id === viewingUserId);
      if (!u) return;

      document.getElementById('editName').value = u.name;
      document.getElementById('editAvatar').value = u.avatar || '👤';
      document.getElementById('editStatus').value = u.status || '';
      document.getElementById('editCity').value = u.city || '';
      document.getElementById('editEdu').value = u.edu || '';
      document.getElementById('editHobby').value = u.hobby || '';

      document.getElementById('editModal').classList.add('active');
    }

    function saveProfileEdit() {
      const u = users.find(item => item.id === viewingUserId);
      if (!u) return;

      u.name = document.getElementById('editName').value.trim() || u.name;
      u.avatar = document.getElementById('editAvatar').value.trim() || '👤';
      u.status = document.getElementById('editStatus').value.trim();
      u.city = document.getElementById('editCity').value.trim();
      u.edu = document.getElementById('editEdu').value.trim();
      u.hobby = document.getElementById('editHobby').value.trim();

      saveUsers(users);
      closeModal('editModal');
      renderApp();
    }

    function openCreateModal() {
      document.getElementById('createName').value = '';
      document.getElementById('createAvatar').value = '⚡';
      document.getElementById('createStatus').value = '';
      document.getElementById('createCity').value = '';
      document.getElementById('createEdu').value = '';
      document.getElementById('createHobby').value = '';
      document.getElementById('createModal').classList.add('active');
    }

    function createNewUser() {
      const name = document.getElementById('createName').value.trim();
      if (!name) {
        alert('Пожалуйста, укажите имя пользователя!');
        return;
      }

      const newUser = {
        id: 'u_' + Date.now(),
        name: name,
        avatar: document.getElementById('createAvatar').value.trim() || '👤',
        status: document.getElementById('createStatus').value.trim(),
        city: document.getElementById('createCity').value.trim(),
        edu: document.getElementById('createEdu').value.trim(),
        hobby: document.getElementById('createHobby').value.trim()
      };

      users.push(newUser);
      saveUsers(users);

      currentUserId = newUser.id;
      viewingUserId = newUser.id;
      localStorage.setItem('tmb_curr_bw', currentUserId);

      closeModal('createModal');
      renderApp();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    window.onload = renderApp;
  </script>
</body>
</html>
